name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: azure/setup-helm@v4

      - name: Restore
        run: dotnet restore EventFlowMcp.sln

      - name: Build
        run: dotnet build EventFlowMcp.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test EventFlowMcp.sln --configuration Release --no-build --no-restore

      - name: Pack distributable projects
        run: |
          for project in \
            src/EventFlowMcp.Abstractions/EventFlowMcp.Abstractions.csproj \
            src/EventFlowMcp.NServiceBus/EventFlowMcp.NServiceBus.csproj \
            src/EventFlowMcp.PostgresProjection/EventFlowMcp.PostgresProjection.csproj; do
            dotnet pack "$project" --configuration Release --no-build --output artifacts
          done
          dotnet msbuild src/EventFlowMcp.Tool/EventFlowMcp.Tool.csproj /t:Pack \
            /p:Configuration=Release /p:NoBuild=true /p:Restore=false \
            /p:BuildProjectReferences=false /p:PackageOutputPath=artifacts

      - name: Validate Helm chart
        run: |
          helm lint deploy/helm/eventflow-mcp --set mcp.apiKey=ci-only-key
          helm template eventflow deploy/helm/eventflow-mcp \
            --set image.repository=example/eventflow-mcp \
            --set mcp.apiKey=ci-only-key > /tmp/eventflow-mcp.yaml

      - name: Validate Docker image build
        run: docker build --tag eventflow-mcp:ci .

      - name: Smoke test the Docker image
        shell: bash
        run: |
          docker run --detach --rm --name eventflow-mcp-ci \
            --publish 3001:8080 \
            --env Mcp__ApiKey=ci-only-key-with-at-least-32-characters \
            eventflow-mcp:ci
          trap 'docker logs eventflow-mcp-ci || true; docker stop eventflow-mcp-ci || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/readyz; then
              exit 0
            fi
            sleep 1
          done
          exit 1
