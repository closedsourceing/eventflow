apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eventflow-mcp.fullname" . }}
  labels:
    {{- include "eventflow-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.autoscaling.enabled }}{{ .Values.autoscaling.minReplicas }}{{ else }}{{ .Values.replicaCount }}{{ end }}
  selector:
    matchLabels:
      {{- include "eventflow-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "eventflow-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "eventflow-mcp.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: eventflow-mcp
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Operations__Provider
              value: {{ .Values.operations.provider | quote }}
            - name: Operations__ServiceControl__ApiBaseUrl
              value: {{ .Values.operations.serviceControl.apiBaseUrl | quote }}
            - name: Operations__ServiceControl__PageSize
              value: {{ .Values.operations.serviceControl.pageSize | quote }}
            {{- if .Values.operations.serviceControl.existingSecret }}
            - name: Operations__ServiceControl__BearerToken
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operations.serviceControl.existingSecret }}
                  key: {{ .Values.operations.serviceControl.existingSecretKey | quote }}
            {{- end }}
            - name: Rag__Provider
              value: {{ .Values.rag.provider | quote }}
            - name: Rag__Http__Endpoint
              value: {{ .Values.rag.http.endpoint | quote }}
            - name: Rag__Http__SearchPath
              value: {{ .Values.rag.http.searchPath | quote }}
            - name: Mcp__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "eventflow-mcp.mcpSecretName" . }}
                  key: {{ .Values.mcp.existingSecretKey | quote }}
            {{- if .Values.rag.http.existingSecret }}
            - name: Rag__Http__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rag.http.existingSecret }}
                  key: {{ .Values.rag.http.existingSecretKey | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
