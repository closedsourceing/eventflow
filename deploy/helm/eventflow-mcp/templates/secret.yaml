{{- if and (not .Values.mcp.existingSecret) (not .Values.mcp.apiKey) }}
{{- fail "Set mcp.apiKey or mcp.existingSecret. The shared HTTP MCP endpoint must be authenticated." }}
{{- end }}
{{- if not .Values.mcp.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eventflow-mcp.mcpSecretName" . }}
  labels:
    {{- include "eventflow-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.mcp.existingSecretKey }}: {{ .Values.mcp.apiKey | quote }}
{{- end }}
