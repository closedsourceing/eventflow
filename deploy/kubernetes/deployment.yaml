apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventflow-mcp
  labels:
    app.kubernetes.io/name: eventflow-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: eventflow-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventflow-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eventflow-mcp
          # Replace with your published image and a pinned tag.
          image: ghcr.io/your-org/eventflow-mcp:0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Operations__Provider
              value: InMemory
            - name: Rag__Provider
              value: InMemory
            - name: Mcp__ApiKey
              valueFrom:
                secretKeyRef:
                  name: eventflow-mcp-auth
                  key: api-key
            - name: Mcp__RateLimitPerMinute
              value: "120"
            - name: Mcp__MaxRequestBodyBytes
              value: "262144"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eventflow-mcp
  labels:
    app.kubernetes.io/name: eventflow-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eventflow-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
